<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxin99 VALORANT Quiz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 10% 10%, #6d38d9, transparent 30%),
        radial-gradient(circle at 90% 90%, #c72f6d, transparent 30%),
        #080914;
}

#app {
    width: min(1000px, calc(100% - 30px));
    margin: auto;
    padding: 40px 0;
}

.card {
    background: rgba(20, 21, 40, 0.96);
    border: 1px solid #3d3f63;
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 25px 80px rgba(0,0,0,.6);
}

h1 {
    font-size: clamp(40px, 7vw, 75px);
    line-height: .95;
}

h2 {
    font-size: 35px;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 15px 25px;
    margin: 6px;
    background: #292b4c;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    filter: brightness(1.2);
    transform: translateY(-2px);
}

.primary {
    background: linear-gradient(135deg, #7855ff, #a33dff);
}

input {
    width: 100%;
    max-width: 400px;
    margin: 7px 0;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #484a70;
    background: #111221;
    color: white;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
}

.answer {
    min-height: 90px;
    text-align: left;
    font-size: 18px;
}

.room {
    font-size: clamp(45px, 10vw, 80px);
    font-weight: 1000;
    letter-spacing: 8px;
}

.player {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    margin: 7px 0;
    background: #242641;
    border-radius: 12px;
}

.timer {
    font-size: 40px;
    font-weight: 1000;
}

.badge {
    display: inline-block;
    background: #292a4a;
    border-radius: 100px;
    padding: 9px 15px;
}

@media (max-width: 700px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 22px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const socket = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://")
    + location.host
);

const app = document.getElementById("app");

let room = null;
let isHost = false;
let answered = false;
let timer = null;


/* =========================
   HILFSFUNKTIONEN
========================= */

function send(data) {
    if (socket.readyState === 1) {
        socket.send(JSON.stringify(data));
    }
}

function escapeHTML(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   STARTSEITE
========================= */

function home() {

    app.innerHTML = `
        <div class="card">

            <span class="badge">
                🎯 NOXIN99 VALORANT QUIZ
            </span>

            <h1>
                Kann Noxin99<br>
                Radiant-Wissen beweisen?
            </h1>

            <p>
                40 Fragen • Multiplayer • Meme & Troll
            </p>

            <button
                class="primary"
                onclick="host()">
                🎙️ Spiel hosten
            </button>

            <button
                onclick="join()">
                👥 Spiel beitreten
            </button>

        </div>
    `;
}


/* =========================
   HOST
========================= */

function host() {

    isHost = true;

    send({
        type: "create"
    });
}


/* =========================
   BEITRETEN
========================= */

function join() {

    app.innerHTML = `
        <div class="card">

            <h1>👥 Beitreten</h1>

            <input
                id="code"
                placeholder="JOIN-CODE"
                maxlength="6">

            <input
                id="name"
                placeholder="Dein Name"
                maxlength="20">

            <br>

            <button
                class="primary"
                onclick="joinRoom()">
                Beitreten
            </button>

        </div>
    `;
}


function joinRoom() {

    const code =
        document.getElementById("code")
        .value
        .trim()
        .toUpperCase();

    const name =
        document.getElementById("name")
        .value
        .trim();

    if (!code || !name) {

        alert(
            "Bitte Code und Namen eingeben."
        );

        return;
    }

    room = code;

    send({
        type: "join",
        code: code,
        name: name
    });
}


/* =========================
   HOST LOBBY
========================= */

function lobby() {

    app.innerHTML = `
        <div class="card">

            <span class="badge">
                🎙️ HOST
            </span>

            <h1>
                Lobby
            </h1>

            <p>
                Join-Code:
            </p>

            <div class="room">
                ${room}
            </div>

            <p>
                Schicke den Code an deine Zuschauer.
            </p>

            <div id="board"></div>

            <button
                class="primary"
                onclick="start()">
                🚀 Quiz starten
            </button>

        </div>
    `;
}


/* =========================
   SPIELER WARTEN
========================= */

function waitForGame(name) {

    app.innerHTML = `
        <div class="card">

            <h1>
                ✅ Du bist dabei!
            </h1>

            <p>
                Spieler:
                <b>${escapeHTML(name)}</b>
            </p>

            <p>
                Warte, bis der Host das Quiz startet…
            </p>

            <div id="board"></div>

        </div>
    `;
}


/* =========================
   QUIZ STARTEN
========================= */

function start() {

    send({
        type: "start"
    });
}


/* =========================
   FRAGE
========================= */

function question(data) {

    answered = false;

    let seconds = data.time;

    app.innerHTML = `
        <div class="card">

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                "
            >

                <b>
                    Frage
                    ${data.index + 1}
                    /
                    ${data.total}
                </b>

                <span
                    class="timer"
                    id="timer">
                    ${seconds}
                </span>

            </div>

            <h2>
                ${escapeHTML(data.question)}
            </h2>

            <div class="answers">

                ${data.answers.map(
                    (answer, index) => `

                    <button
                        class="answer"
                        onclick="answer(${index})">

                        ${String.fromCharCode(65 + index)})
                        ${escapeHTML(answer)}

                    </button>

                `
                ).join("")}

            </div>

        </div>
    `;


    clearInterval(timer);


    timer = setInterval(() => {

        seconds--;

        const element =
            document.getElementById("timer");

        if (element) {
            element.textContent = seconds;
        }

        if (seconds <= 0) {
            clearInterval(timer);
        }

    }, 1000);
}


/* =========================
   ANTWORT
========================= */

function answer(choice) {

    if (answered) {
        return;
    }

    answered = true;

    send({
        type: "answer",
        choice: choice
    });


    app.innerHTML = `
        <div class="card">

            <h1>
                ✅ Antwort gespeichert
            </h1>

            <p>
                Warte auf die anderen Spieler…
            </p>

        </div>
    `;
}


/* =========================
   LEADERBOARD
========================= */

function leaderboard(list) {

    const element =
        document.getElementById("board");

    if (!element) {
        return;
    }

    element.innerHTML = `
        <h2>
            🏆 Ranking
        </h2>

        ${
            list.map(player => `

                <div class="player">

                    <span>
                        ${player.position}.
                        ${escapeHTML(player.name)}
                    </span>

                    <b>
                        ${player.score}
                    </b>

                </div>

            `).join("")
        }
    `;
}


/* =========================
   ERGEBNIS
========================= */

function result(data) {

    clearInterval(timer);

    app.innerHTML = `
        <div class="card">

            <h1>
                📊 Runde beendet
            </h1>

            <p>
                Richtige Antwort:
                <b>
                    ${String.fromCharCode(
                        65 + data.correct
                    )}
                </b>
            </p>

            <div id="board"></div>

            ${
                isHost

                ?

                `
                <button
                    class="primary"
                    onclick="nextQuestion()">

                    ➡️ Nächste Frage

                </button>
                `

                :

                `
                <p>
                    Warte auf den Host…
                </p>
                `
            }

        </div>
    `;

    leaderboard(data.leaderboard);
}


/* =========================
   NÄCHSTE FRAGE
========================= */

function nextQuestion() {

    send({
        type: "next"
    });
}


/* =========================
   ENDE
========================= */

function finished(list) {

    app.innerHTML = `
        <div class="card">

            <h1>
                🏆 QUIZ BEENDET
            </h1>

            <p>
                Wer hat den
                <b>Radiant-Brain-Test</b>
                bestanden?
            </p>

            <div id="board"></div>

        </div>
    `;

    leaderboard(list);
}


/* =========================
   WEBSOCKET
========================= */

socket.onmessage = function(event) {

    const data =
        JSON.parse(event.data);


    if (data.type === "roomCreated") {

        room = data.code;

        lobby();
    }


    if (data.type === "joined") {

        waitForGame(data.name);
    }


    if (data.type === "leaderboard") {

        leaderboard(
            data.leaderboard
        );
    }


    if (data.type === "question") {

        question(data);
    }


    if (data.type === "result") {

        result(data);
    }


    if (data.type === "finished") {

        finished(
            data.leaderboard
        );
    }


    if (data.type === "error") {

        alert(data.message);

        home();
    }

};


socket.onopen = function() {

    home();

};

</script>

</body>
</html>
